<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FitTrack - Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-card { max-width: 500px; margin: 0 auto; }
    </style>
</head>
<body>

    <header>
        <h2>FitTrack Hub</h2>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
                <li><a href="about.html">About Us</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="box" style="text-align: center;">
            <img src="https://placehold.co/650x130/1b4332/ffffff?text=FitTrack+-+Click+Here+For+About+Us" 
                 alt="FitTrack Banner" usemap="#fitmap" style="border-radius: 8px; max-width: 100%;">
            <map name="fitmap">
                <area shape="rect" coords="0,0,650,130" href="about.html" alt="About Us">
            </map>
        </div>

        <section class="box form-card">
            <h2 style="margin-bottom: 15px; color: #1b4332;">Create Your FitTrack Account</h2>
            <form onsubmit="handleSignup(event)">
                <div class="input-group">
                    <label for="userName">Full Name:</label>
                    <input type="text" id="userName" required placeholder="e.g. Faris Almutairi">
                </div>
                <div class="input-group">
                    <label for="regEmail">Email Address:</label>
                    <input type="email" id="regEmail" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label for="regPass">Password:</label>
                    <input type="password" id="regPass" required placeholder="Create a strong password">
                </div>
                <button type="submit" class="btn">Sign Up</button>
            </form>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 FitTrack Project - CPIS-358</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
