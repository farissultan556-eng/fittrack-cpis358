<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FitTrack - Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .form-card { max-width: 450px; margin: 0 auto; }
    </style>
</head>
<body>

    <header>
        <h2>FitTrack Hub</h2>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="signup.html">Sign Up</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><button id="theme-btn" class="btn" onclick="toggleTheme()" style="padding: 6px 12px;">Dark Mode</button></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        <div class="box" style="text-align: center;">
            <img src="https://placehold.co/650x130/1b4332/ffffff?text=FitTrack+-+Click+Here+For+About+Us" 
                 alt="FitTrack Banner" usemap="#fitmap" style="border-radius: 8px; max-width: 100%;">
            <map name="fitmap">
                <area shape="rect" coords="0,0,650,130" href="about.html" alt="About Us">
            </map>
        </div>

        <section class="box form-card">
            <h2 style="margin-bottom: 15px; color: #1b4332;">Member Login</h2>
            <p id="loginError" class="error-msg"></p>
            <form onsubmit="return handleLogin(event)" novalidate>
                <div class="input-group">
                    <label for="userEmail">Email Address:</label>
                    <input type="email" id="userEmail" placeholder="Enter your email (must include @)">
                </div>
                <div class="input-group">
                    <label for="userPass">Password (min 6 characters):</label>
                    <input type="password" id="userPass" placeholder="Enter your password">
                </div>
                <button type="submit" class="btn">Login</button>
            </form>
            <p style="margin-top: 15px;">New to FitTrack? <a href="signup.html">Create an account</a>.</p>
        </section>
    </div>

    <footer>
        <p>&copy; 2026 FitTrack Project - CPIS-358</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
